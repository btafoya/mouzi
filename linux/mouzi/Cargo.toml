[package]
name = "mouzi-linux"
version = "0.2.1"
description = "Mouzi for Linux: TUI + systemd user daemon"
edition = "2021"

[[bin]]
name = "mouzi"
path = "src/main.rs"

[dependencies]
mouzi-core = { path = "../mouzi-core" }
directories = "5"
chrono = "0.4"
serde_json = "1"
notify = "7"
signal-hook = "0.3"
ratatui = "0.29"
crossterm = "0.28"

[package.metadata.deb]
name = "mouzi-linux"
section = "utils"
depends = "$auto"
assets = [
    ["target/release/mouzi", "usr/bin/", "755"],
    ["../mouzi.service", "usr/lib/systemd/user/", "644"],
]
